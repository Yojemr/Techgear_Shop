[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# La plantilla oficial contiene textos descriptivos que superan el límite de línea.
"**/mongo_migrations/**" = ["E501"]
