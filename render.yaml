# Render lee este Blueprint desde la raíz del repositorio.
services:
  - type: web
    name: techgear-shop-api
    runtime: python
    plan: free
    rootDir: techgear_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: techgear_shop
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
