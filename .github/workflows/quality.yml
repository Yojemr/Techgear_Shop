name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Valida contratos y ciclo de vida con conexiones simuladas, sin secretos de Atlas.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install API and development dependencies
        run: python -m pip install -r techgear_api/requirements.txt -r requirements-dev.txt
      - name: Check formatting and code
        run: |
          python -m ruff check .
          python -m ruff format --check .
          git diff --check
          python -m pip check
      - name: Run isolated tests
        env:
          PYTHONPATH: techgear_api
        run: python -m unittest discover -s techgear_api/tests -v

  # Comprueba Django con configuración ficticia; no ejecuta migraciones ni consultas.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install Django dependencies
        run: python -m pip install -r techgear_web/requirements.txt
      - name: Check Django configuration
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-a-production-key
          DJANGO_DEBUG: 'False'
          MONGO_URI: mongodb://127.0.0.1:27017/
          MONGO_DB_NAME: techgear_ci
        run: |
          python techgear_web/manage.py check
          python techgear_web/manage.py test config techgear_shop --verbosity 2
          python -m pip check
